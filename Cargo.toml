[workspace]
resolver = "2"
members = [
    "crates/kojora-core",
    "crates/kojora-cli",
    "crates/kojora-runtime",
    "crates/kojora-agents",
    "crates/kojora-studio",
    "crates/kojora-desktop",
]

# Normal headless builds must not compile the desktop renderer.
default-members = [
    "crates/kojora-core",
    "crates/kojora-cli",
    "crates/kojora-runtime",
    "crates/kojora-agents",
    "crates/kojora-studio",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/kauja/kojora"
