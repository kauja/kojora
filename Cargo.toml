[workspace]
resolver = "2"
members = [
    "crates/kojora-core",
    "crates/kojora-cli",
    "crates/kojora-runtime",
    "crates/kojora-agents",
    "crates/kojora-studio",
    "crates/kojora-desktop",
    "crates/kojora-worker",
]

# Normal headless builds must not compile the desktop renderer.
default-members = [
    "crates/kojora-core",
    "crates/kojora-cli",
    "crates/kojora-runtime",
    "crates/kojora-agents",
    "crates/kojora-studio",
    "crates/kojora-worker",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/kauja/kojora"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
