name: Rust CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libssl-dev xvfb xauth libgl1-mesa-dri
      - name: Verify architecture, format, behavior and lints
        run: ./scripts/verify
      - name: Smoke-launch the native Studio under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo build --locked -p kojora-desktop
          test_dir="$(mktemp -d)"
          chmod 700 "$test_dir"
          set +e
          timeout 12s xvfb-run -a target/debug/kojora-desktop --data-dir "$test_dir"
          code=$?
          set -e
          test -f "$test_dir/instance.lock"
          rm -rf "$test_dir"
          if [ "$code" -ne 124 ]; then
            echo "Desktop did not stay running: exit $code"
            exit 1
          fi

  desktop-macos:
    name: Desktop (macOS / Apple Silicon)
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
      - name: Check native desktop on macOS
        run: cargo check --locked -p kojora-desktop --all-targets
