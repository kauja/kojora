name: Rust CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libssl-dev xvfb xauth libgl1-mesa-dri
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Smoke-launch the native Studio under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo build -p kojora-desktop
          test_dir="$(mktemp -d)"
          chmod 700 "$test_dir"
          set +e
          timeout 12s xvfb-run -a target/debug/kojora-desktop --data-dir "$test_dir"
          code=$?
          set -e
          test -f "$test_dir/instance.lock"
          rm -rf "$test_dir"
          if [ "$code" -ne 124 ]; then
            echo "Desktop did not stay running: exit $code"
            exit 1
          fi

  desktop-macos:
    name: Desktop (macOS / Apple Silicon)
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native desktop on macOS
        run: cargo check -p kojora-desktop --all-targets
